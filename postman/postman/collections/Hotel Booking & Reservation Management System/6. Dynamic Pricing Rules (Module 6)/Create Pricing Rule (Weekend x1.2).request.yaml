$kind: http-request
url: "{{baseUrl}}/pricing-rules"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{adminToken}}
body:
  type: text
  content: |-
    {
      "roomTypeId": "{{roomTypeId}}",
      "season": "Weekend",
      "dayOfWeek": [0, 6],
      "multiplier": 1.2
    }
order: 1000
