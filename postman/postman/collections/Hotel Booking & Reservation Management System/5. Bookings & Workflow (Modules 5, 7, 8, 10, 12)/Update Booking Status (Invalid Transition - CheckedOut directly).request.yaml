$kind: http-request
name: Update Booking Status (Invalid Transition -> CheckedOut directly)
url: "{{baseUrl}}/bookings/{{bookingId}}/status"
method: PUT
headers:
  Content-Type: application/json
  Authorization: Bearer {{staffToken}}
body:
  type: text
  content: |-
    {
      "status": "CheckedOut"
    }
order: 6000
